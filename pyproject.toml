[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "compatible-mpc"
version = "0.1.0"
description = "Safe learning-based MPC with the compatible models approach: a guaranteed model certifies safety, a learned model inside it drives performance, both updated online."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anas Makdesi" }, { name = "Antoine Girard" }, { name = "Laurent Fribourg" }]
keywords = ["model predictive control", "safe learning", "data-driven control", "safety filter", "abstraction", "online learning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.9",
  "numba>=0.57",
  "ddma @ git+https://github.com/anas-makdesi/ddma@v0.12.0",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# zip(strict=) exists from Python 3.10; adding it everywhere would change behaviour (B905)
ignore = ["B905"]
